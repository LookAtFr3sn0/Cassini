services:
  db:
    image: postgres:18-alpine
    container_name: cassini-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cassini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cassini}
      POSTGRES_DB: ${POSTGRES_DB:-cassini}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-cassini}", "-d", "${POSTGRES_DB:-cassini}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - db
    volumes:
      - db_data:/var/lib/postgresql
  
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: cassini-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cassini}:${POSTGRES_PASSWORD:-cassini}@db:5432/${POSTGRES_DB:-cassini}
      SINGLE_USER: ${SINGLE_USER:-true}
      RECOMMENDER_DB_PASSWORD: ${RECOMMENDER_DB_PASSWORD:-recommender}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      RECOMMENDATIONS_ENABLED: ${RECOMMENDATIONS_ENABLED:-true}
      RECOMMENDERS: ${RECOMMENDERS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - db
    ports:
      - "3000:3000"

  recommender:
    image: ghcr.io/cassini-fm/recommender:latest
    container_name: cassini-recommender
    environment:
      DATABASE_URL: postgres://recommender:${RECOMMENDER_DB_PASSWORD:-cassini}@db:5432/${POSTGRES_DB:-cassini}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - db

networks:
  db:
    name: cassini_db
    driver: bridge

volumes:
  db_data:
